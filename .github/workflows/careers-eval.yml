name: careers-eval
on:
  push:
    paths: ['careers/**', '.github/workflows/careers-eval.yml']
  pull_request:
    paths: ['careers/**', '.github/workflows/careers-eval.yml']
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate + unit eval
        working-directory: careers
        run: npm test
