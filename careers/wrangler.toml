name = "careers-hansakoch"
main = "src/worker.ts"
compatibility_date = "2026-09-12"

[vars]
# Set CAREERS_PASSWORD as a secret: wrangler secret put CAREERS_PASSWORD
NOTIFY_EMAIL = "hans@hansakoch.com"
CF_MEMORY_NAMESPACE = "alfred-report"
CF_MEMORY_PROFILE = "careers"
CF_ACCOUNT_ID = "0870b0bdbc14bcd31f43fe5e82c3ee8e"
CF_ARTIFACTS_NAMESPACE = "alfred-command"

[[d1_databases]]
binding = "DB"
database_name = "careers-hak"
database_id = "6410cd87-5313-4761-8226-aa3a635e249d"

# Iceberg Media Artifacts closed beta. Master git: alfred-command / open-careers
[[artifacts]]
binding = "ARTIFACTS"
namespace = "alfred-command"

[triggers]
crons = ["0 8 * * *"]
