# Copy to profile.yaml and edit. No secrets in this file.
name: Your Name
email: you@example.com
notify_email: you@example.com
hot_limit: 20

# Resume vault paths on Vultr (~/.vault/...) — not clickable from CF Worker; not committed to git
resume_vault:
  seo_aeo: ~/.vault/resume_vault/seo-aeo.md
  ai_enablement: ~/.vault/resume_vault/ai-enablement.md
  webmaster: ~/.vault/resume_vault/webmaster.md

# Address notes for ATS forms (example: Wayne MI + Plivo SMS)
address:
  city: Wayne
  state: MI
  country: US
  phone: "+1XXXXXXXXXX"
  home_base: "Cebu, PH — use VPN headed browser for USA-only ATS submit"

priorities:
  families:
    - seo
    - aeo
    - geo
    - ppc
    - orm
    - growth-not-quota
    - ai-enablement
    - webmaster
    - agents
    - crypto-marketing
  locations:
    - remote
    - ph-timezone
    - michigan
    - california
    - texas
    - usa
    - asia
    - italy
  salary_filter: false

queries:
  - { term: "SEO director", location: "remote" }
  - { term: "AEO lead", location: "remote" }
  - { term: "AI enablement", location: "remote" }
  - { term: "PPC director", location: "remote" }
  - { term: "webmaster", location: "remote" }

# Extra deny patterns (added to built-in Gate 0)
deny_extra: []

# Email ingest: forward job alerts to your Worker email route (see README)
# Archive after review: Gmail label careers/archived
